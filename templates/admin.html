<form action="/api/admin/logistics/dispatch" method="POST" class="dispatch-form">
    <input type="hidden" name="trip_id" value="{{ p.sid }}">
    
    <select name="driver_name" required>
        <option value="Tai_Xe_1">Tài xế Nguyễn Văn A</option>
        <option value="Tai_Xe_2">Tài xế Trần Văn B</option>
    </select>
    
    <button type="submit" style="background: #0066cc; color: white; padding: 5px 10px; border-radius: 4px;">
        💬 Điều phối Zalo
    </button>
</form>
