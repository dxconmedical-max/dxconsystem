<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXCON - Đăng Nhập Hệ Thống Phân Quyền</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4 shadow border-0 rounded-3">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary">🏥 DXCON MEDICAL SYSTEMS</h3>
                        <p class="text-muted">Trung tâm phân quyền Đăng nhập Bác sĩ & Admin</p>
                    </div>
                    
                    {% if error %}
                    <div class="alert alert-danger text-center p-2" style="font-size: 14px;">{{ error }}</div>
                    {% endif %}
                    
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tài khoản thành viên</label>
                            <input type="text" class="form-control" name="username" required placeholder="Nhập username...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật khẩu xác thực</label>
                            <input type="password" class="form-control" name="password" required placeholder="******">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">🔒 ĐĂNG NHẬP AN TOÀN</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/" class="text-decoration-none text-muted" style="font-size: 13px;">← Quay ra cổng bệnh nhân vãng lai</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
